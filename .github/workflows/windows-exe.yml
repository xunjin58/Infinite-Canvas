name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Build single-file application
        run: pyinstaller --noconfirm --clean infinite_canvas.spec
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Infinite-Canvas.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Infinite-Canvas.exe" | Out-File -Encoding ascii dist/Infinite-Canvas.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Infinite-Canvas-windows-x64
          path: |
            dist/Infinite-Canvas.exe
            dist/Infinite-Canvas.exe.sha256
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Infinite-Canvas.exe
            dist/Infinite-Canvas.exe.sha256
